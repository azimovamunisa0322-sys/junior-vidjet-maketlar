<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Junior · Bugungi reja — mobil maket</title>
<meta name="theme-color" content="#f5f6f8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;800;900&display=swap">
<style>
/* ============================================================
   Junior — «Bugungi reja» bosh sahifasining mobil maketi
   Ranglar, shriftlar, o'lchamlar va animatsiyalar veb versiyadan
   (junior-academy.vercel.app) 1:1 olingan.
   ============================================================ */

:root{
  --brand-50:#fff3ed; --brand-100:#ffe3d4; --brand-200:#ffc2a8; --brand-300:#ff9871;
  --brand-400:#ff6f3d; --brand-500:#fe5b1a; --brand-600:#ef4308; --brand-700:#c63209;
  --coin:#fec802; --xp:#7b61ff; --go:#24ae3c; --stop:#d80000;
  --ink-300:#9aa3b2; --ink-500:#6b7280; --ink-700:#333a4a; --ink-900:#10131a;
  --surface:#f5f6f8; --white:#fff;
  --r-lg:.5rem; --r-xl:.75rem; --r-2xl:1rem; --r-3xl:1.5rem;
  --shadow-sm:0 1px 3px 0 #0000001a,0 1px 2px -1px #0000001a;
  --shadow-md:0 4px 6px -1px #0000001a,0 2px 4px -2px #0000001a;
  --phone-w:390px;      /* ekran kengligi — haqiqiy telefondagidek */
  --phone-bezel:11px;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:Roboto,ui-sans-serif,system-ui,sans-serif;
  color:var(--ink-900);
  background:#e9ebef;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{display:block}
ul{margin:0;padding:0;list-style:none}
p,h1,h2,h3{margin:0}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- ANIMATSIYALAR (veb versiyadan) ---------- */
@keyframes jr-float{0%,to{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes jr-float-s{0%,to{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes jr-pop{0%{opacity:0;transform:scale(.85)}60%{transform:scale(1.06)}to{opacity:1;transform:scale(1)}}
@keyframes jr-spin{to{transform:rotate(360deg)}}
@keyframes jr-flame{0%,to{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.14) rotate(4deg)}}
@keyframes jr-rise{0%{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes jr-nudge{0%,to{transform:translate(0)}50%{transform:translateX(4px)}}
.anim-float{animation:4.5s ease-in-out infinite jr-float}
.anim-float-s{animation:3.2s ease-in-out infinite jr-float-s}
.anim-pop{animation:.45s cubic-bezier(.2,.9,.3,1.3) both jr-pop}
.anim-slowspin{animation:26s linear infinite jr-spin}
.anim-flame{transform-origin:50% 80%;animation:1.5s ease-in-out infinite jr-flame}
.anim-rise{animation:.5s ease-out both jr-rise}
.anim-nudge{animation:1.1s ease-in-out infinite jr-nudge}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* ============================================================
   TELEFON RAMKASI — katta ekranda; telefonda ramkasiz
   ============================================================ */
.stage{
  min-height:100vh;
  display:flex; flex-direction:column; align-items:center;
  padding:26px 16px 40px;
  background:
    radial-gradient(900px 400px at 50% -8%, #ffe3d4 0%, transparent 60%),
    #e9ebef;
}
.stage-head{width:min(420px,100%);margin-bottom:16px;text-align:center}
.stage-head h1{font-size:15px;font-weight:900;letter-spacing:-.01em}
.stage-head p{margin-top:3px;font-size:12px;font-weight:500;color:var(--ink-500)}

.phone{
  position:relative;
  width:calc(var(--phone-w) + var(--phone-bezel) * 2);
  height:calc(844px + var(--phone-bezel) * 2);
  max-height:calc(100vh - 120px);
  background:#000;
  border-radius:54px;
  padding:var(--phone-bezel);
  box-shadow:0 30px 60px -20px #10131a5c, 0 0 0 1px #00000014;
  flex:none;
}
.phone-screen{
  position:relative;
  height:100%;
  border-radius:43px;
  overflow:hidden;
  background:var(--surface);
  display:flex; flex-direction:column;
}
.notch{
  position:absolute;left:50%;top:9px;transform:translateX(-50%);
  width:112px;height:29px;border-radius:999px;background:#000;z-index:60;
}

/* Soat qatori — notch ostidagi joy */
.statusbar{
  flex:none;height:46px;
  display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 26px 4px;
  font-size:13px;font-weight:700;letter-spacing:.01em;
  background:#f5f6f8d9;
}
.statusbar .sb-right{display:flex;align-items:center;gap:5px}
.statusbar svg{width:16px;height:16px}

/* Sahifa oqimi — ichki skroll */
.scroll{
  flex:1; overflow-y:auto; overscroll-behavior:contain;
  scrollbar-width:none;
}
.scroll::-webkit-scrollbar{display:none}

/* Telefonda: ramkasiz, to'liq ekran */
@media (max-width:640px){
  .stage{padding:0;background:var(--surface);display:block}
  .stage-head{display:none}
  .phone{width:100%;height:100dvh;max-height:none;border-radius:0;padding:0;box-shadow:none;background:var(--surface)}
  .phone-screen{border-radius:0}
  .notch{display:none}
  .statusbar{display:none}
  .appbar{padding-top:calc(10px + env(safe-area-inset-top))}
}
