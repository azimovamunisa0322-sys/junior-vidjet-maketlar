<title>Разожги свой стрик</title>
<style>
html, body {
  margin: 0 !important;
  padding: 0 !important;
  width: 100%;
  height: 100%;
  overflow: hidden !important;
  background: #140d27;
  -webkit-text-size-adjust: 100%;
  overscroll-behavior: none;
}
body {
  display: block !important;
  min-height: 0 !important;
}
html.ignite-preview-lit,
body.ignite-preview-lit,
body.ignite-preview-lit #streak-ignite,
body.ignite-preview-lit #streak-ignite .ignite-phone {
  background: transparent !important;
}
body.ignite-preview-lit .ignite-art > rect,
body.ignite-preview-lit .ignite-static,
body.ignite-preview-lit .ignite-capsule,
body.ignite-preview-lit .ignite-chevrons,
body.ignite-preview-lit .ignite-effects,
body.ignite-preview-lit .ignite-gesture {
  display: none !important;
}
#streak-ignite {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: flex !important;
  align-items: center;
  justify-content: center;
  gap: 0 !important;
  padding: 0 !important;
  background: transparent !important;
}
#streak-ignite > .ignite-heading,
#streak-ignite > .ignite-meta {
  display: none !important;
}
#streak-ignite .ignite-phone {
  flex: none;
  width: min(100vw, calc(100dvh * 393 / 852)) !important;
  height: auto !important;
  min-width: 0 !important;
  max-width: none !important;
  max-height: none !important;
  aspect-ratio: 393 / 852;
  border-radius: 0 !important;
  box-shadow: none !important;
}

</style>
</head>

<div id="streak-ignite" class="viz-dotted-background">
  <style>
    #streak-ignite .ignite-art { position:absolute; inset:0; width:100%; height:100%; display:block; z-index:1; pointer-events:none; }
    #streak-ignite {
      --ignite-ink: light-dark(#2c2536, #f1edf5);
      --ignite-muted: light-dark(#706879, #b7adbf);
      --ignite-control: light-dark(#f2edf4, #28212e);
      --ignite-control-border: light-dark(#ddd4e4, #45394e);
      display: grid;
      justify-items: center;
      gap: 14px;
      padding: 16px 10px 20px;
      color: var(--ignite-ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      box-sizing: border-box;
    }
    #streak-ignite * { box-sizing: border-box; }
    #streak-ignite .ignite-heading {
      margin: 0; font-size: 18px; line-height: 1.3; font-weight: 600; text-align: center;
    }
    #streak-ignite .ignite-phone {
      position: relative;
      width: min(100%, 330px);
      aspect-ratio: 393 / 852;
      overflow: hidden;
      isolation: isolate;
      border-radius: 28px;
      background: #140d27;
      box-shadow: 0 16px 44px #10091c26, 0 0 0 1px #ffffff14;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #streak-ignite .ignite-image, #streak-ignite .ignite-effects, #streak-ignite .ignite-aura {
      position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none;
    }
    #streak-ignite .ignite-image {
      display: block; object-fit: fill; -webkit-user-drag: none; will-change: opacity;
    }
    #streak-ignite .ignite-image--cold { z-index: 1; }
    #streak-ignite .ignite-image--warm { z-index: 2; opacity: 0; }
    #streak-ignite .ignite-image--lit { z-index: 3; opacity: 0; }
    #streak-ignite .ignite-aura {
      z-index: 4; opacity: 0;
      background: radial-gradient(ellipse 30% 18% at 50% 37%, #ffab393d, #ff54151c 42%, transparent 75%);
      mix-blend-mode: screen;
    }

    #streak-ignite .ignite-effects { z-index: 6; }
    #streak-ignite .ignite-gesture {
      position: absolute; z-index: 7; inset: 56% 0 0; display: block; width: 100%; height: 44%;
      border: 0; border-radius: 0; padding: 0; color: inherit; background: transparent;
      touch-action: none; cursor: grab;
    }
    #streak-ignite .ignite-gesture:active { cursor: grabbing; }
    #streak-ignite .ignite-gesture:focus-visible {
      outline: 2px solid #ffd567; outline-offset: -5px; border-radius: 20px;
    }
    #streak-ignite .ignite-meta { display: grid; gap: 10px; justify-items: center; }
    #streak-ignite .ignite-status {
      margin: 0; min-height: 20px; color: var(--ignite-muted); font-size: 13px; line-height: 20px; text-align: center;
    }
    #streak-ignite .ignite-controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
    #streak-ignite .ignite-control {
      min-height: 40px; padding: 8px 14px; border: 1px solid var(--ignite-control-border);
      border-radius: 11px; background: var(--ignite-control); color: var(--ignite-ink);
      font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;
    }
    #streak-ignite .ignite-control:active { opacity: .7; }
    #streak-ignite .ignite-control:focus-visible { outline: 2px solid #ffb238; outline-offset: 3px; }
    #streak-ignite .ignite-sr {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }
    @media (pointer: coarse) { #streak-ignite .ignite-control { min-height: 44px; } }
    @media (max-width: 360px) {
      #streak-ignite { padding-inline: 0; }
      #streak-ignite .ignite-phone { border-radius: 24px; }
    }

  window.addEventListener("blur", release);
  document.addEventListener("visibilitychange", () => { if (document.hidden) release(); else if (state === "lit") wake(); });
  root.querySelector('[data-action="reset"]').addEventListener("click", () => reset());
  root.querySelector('[data-action="demo"]').addEventListener("click", () => {
    reset(true); demoStart = performance.now(); active = true; setState("dragging"); wake();
  });
  reduceQuery.addEventListener("change", event => { reduced = event.matches; if (reduced) particles = []; wake(); });
  resize(); paint(performance.now(), 1); wake();
  if (new URLSearchParams(window.location.search).get("preview") === "lit") {
    document.documentElement.classList.add("ignite-preview-lit");
    document.body.classList.add("ignite-preview-lit");
    ignite(performance.now());
    heat = target = 1;
    paint(performance.now(), 1 / 60);
  }
})();

</script>
</div>

</body>
